<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rekap Ikan - PT Rafasya Putra Ustanto</title>
  <meta name="theme-color" content="#2c7da0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rekap Ikan">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon/icon-192.png">
  <link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
  <style>
    html, body { margin:0; height:100%; background:#2c7da0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    #app { position:fixed; inset:0; padding-top:env(safe-area-inset-top); background:#2c7da0; }
    iframe { width:100%; height:100%; border:0; background:#f4f6f8; display:block; }
    #loader { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:14px; background:#2c7da0; color:#fff; text-align:center; padding:24px; transition:opacity .3s; }
    #loader.hide { opacity:0; pointer-events:none; }
    #loader img { width:96px; height:96px; border-radius:22px; }
    .spin { width:34px; height:34px; border:4px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:p 1s linear infinite; }
    @keyframes p { to { transform:rotate(360deg); } }
    #bantuan { display:none; font-size:.85rem; opacity:.95; max-width:340px; }
    #bantuan a, #btnUlang { color:#2c7da0; background:#fff; border:0; padding:8px 16px; border-radius:8px; text-decoration:none; font-weight:600; font-size:.9rem; margin:4px; display:inline-block; cursor:pointer; }
    #offline { display:none; }
  </style>
</head>
<body>
  <div id="loader">
    <img src="icon/icon-192.png" alt="Logo">
    <strong>PT. RAFASYA PUTRA USTANTO</strong>
    <div class="spin" id="spin"></div>
    <div id="offline">Tidak ada koneksi internet.<br>Aplikasi membutuhkan internet untuk memuat data.</div>
    <div id="bantuan">
      Memuat terasa lama? Periksa koneksi internet Anda.<br>
      <a id="linkLangsung" href="#" target="_blank" rel="noopener">Buka langsung</a>
      <button id="btnUlang" type="button">Muat ulang</button>
    </div>
  </div>

  <div id="app">
    <iframe id="frame" title="Aplikasi Rekap Ikan"
      allow="clipboard-read; clipboard-write; camera; fullscreen"
      referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>

  <script>
    // ===== ALAMAT WEB APP APPS SCRIPT (ganti di sini bila deployment diganti) =====
    var APP_URL = 'https://script.google.com/macros/s/AKfycbwHNcKER1E60VV6r3ydJM0xemX4Ek6DFAeK_ejNFCckrwh10pWf09Hv3sJmjhxMrg3i/exec';

    var frame = document.getElementById('frame');
    var loader = document.getElementById('loader');
    var bantuan = document.getElementById('bantuan');
    var offline = document.getElementById('offline');
    var spin = document.getElementById('spin');
    var timerBantuan = null;

    document.getElementById('linkLangsung').href = APP_URL;

    function muat() {
      loader.classList.remove('hide');
      if (!navigator.onLine) { tampilOffline(); return; }
      offline.style.display = 'none'; spin.style.display = '';
      bantuan.style.display = 'none';
      clearTimeout(timerBantuan);
      timerBantuan = setTimeout(function () { bantuan.style.display = 'block'; }, 10000);
      frame.src = APP_URL;
    }
    function tampilOffline() {
      spin.style.display = 'none';
      offline.style.display = 'block';
      bantuan.style.display = 'block';
    }

    frame.addEventListener('load', function () {
      if (!frame.src || frame.src === 'about:blank') return;
      clearTimeout(timerBantuan);
      setTimeout(function () { loader.classList.add('hide'); }, 600);
    });
    document.getElementById('btnUlang').addEventListener('click', function () { frame.src = 'about:blank'; muat(); });
    window.addEventListener('online', muat);
    window.addEventListener('offline', tampilOffline);

    muat();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
